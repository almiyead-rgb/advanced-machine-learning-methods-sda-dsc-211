schema_version: 1
course:
  code: SDA-DSC-211
  version: 1.1.0
  title:
    en: Advanced Machine Learning Methods
    ar: أساليب تعلم الآلة المتقدمة
  promise:
    en: Learn, run, compare, answer and build one integrated project.
    ar: تعلم ونفذ وقارن وأجب وابن مشروعًا واحدًا متكاملًا.
  instructor:
    en: Meaad Al-Marri
    ar: ميعاد المري
    github: almiyead-rgb
  duration:
    contact_hours: 20
    days: 5
    hours_per_day: 4
    lab_minutes_per_day: 60
  delivery:
    environment: Google Colab
    compute: Free CPU
    paid_subscription_required: false
    api_key_required: false
    gpu_required: false
    repository_model: Normal public GitHub repository with browser uploads
  project:
    name: Tamweel Lite
    data_status:
      en: Synthetic educational data
      ar: بيانات تعليمية اصطناعية
    daily_model:
      en: One lab, one expected-result check, one answer and one upload per day.
      ar: لاب واحد ومقارنة نتائج وإجابة ورفع واحد في كل يوم.
  assessment:
    technical_points: 80
    administrative_points: 20
    project_points: 100
    presentation_points: 0
    total_points: 100
    pass_score: 70
    attendance_is_separate_eligibility_requirement: true
  certificate:
    completion:
      ar: استيفاء الحضور وتسليم مشروع بدرجة 70 فأعلى
      en: Attendance met, project submitted and score at least 70
    attendance_only:
      ar: استيفاء الحضور دون مشروع أو بدرجة أقل من 70
      en: Attendance met without a project or with score below 70
  attribution:
    copyright_year: 2026
    statement_en: Prepared and delivered by Meaad Al-Marri.
    statement_ar: إعداد وتقديم ميعاد المري.
    sdaia_disclaimer_en: This learning portal is not an official SDAIA account.
    sdaia_disclaimer_ar: هذه البوابة التعليمية ليست حسابًا رسميًا لسدايا.
learning_outcomes:
  - id: LO1
    en: Build and compare Logistic Regression, XGBoost and LightGBM.
    ar: بناء ومقارنة Logistic Regression وXGBoost وLightGBM.
  - id: LO2
    en: Design validation that controls time, customer and target leakage.
    ar: تصميم تحقق يضبط تسرب الزمن والعملاء والهدف.
  - id: LO3
    en: Choose decisions using explicit simulated cost and capacity constraints.
    ar: اختيار القرارات وفق تكلفة تعليمية وقيود سعة واضحة.
  - id: LO4
    en: Explain model behaviour using permutation importance and SHAP without causal claims.
    ar: تفسير سلوك النموذج دون ادعاء السببية.
  - id: LO5
    en: Evaluate calibration, stability and operational limits.
    ar: تقييم المعايرة والاستقرار والحدود التشغيلية.
  - id: LO6
    en: Compare single models and ensembles with honest OOF evidence.
    ar: مقارنة النماذج المفردة والتجميع باستخدام أدلة OOF صادقة.
  - id: LO7
    en: Deliver a reproducible GitHub project with generated technical evidence and five daily answers.
    ar: تسليم مشروع GitHub قابل لإعادة الإنتاج مع أدلة تقنية وإجابات الأيام الخمسة.
