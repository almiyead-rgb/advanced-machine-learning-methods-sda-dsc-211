<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#201d18">
<title>Page not found | الصفحة غير موجودة</title>
<style>
:root{font-family:Inter,"Segoe UI",Tahoma,Arial,sans-serif;color:#211f1c;background:#f1ede6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(145deg,#f8f3e9,#e4d3b2)}main{width:min(50rem,100%);background:rgba(255,255,255,.92);border:1px solid #d8c7a7;border-radius:1.2rem;padding:clamp(1.5rem,5vw,3.5rem);box-shadow:0 20px 50px rgba(55,44,28,.13)}.logo{width:5rem;height:5rem;object-fit:cover;border-radius:.8rem;border:1px solid #c5a86f}h1{font-size:clamp(2rem,5vw,3.5rem);margin:.8rem 0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}.columns>div+div{border-left:1px solid #ddd0ba;padding-left:1.5rem}.btn{display:inline-block;margin-top:1rem;padding:.75rem 1rem;border-radius:.65rem;background:#201d19;color:#fff;text-decoration:none;font-weight:700}.muted{color:#70675c}@media(max-width:650px){.columns{grid-template-columns:1fr}.columns>div+div{border-left:0;border-top:1px solid #ddd0ba;padding-left:0;padding-top:1rem}}
</style>
</head>
<body>
<main>
<img class="logo" src="assets/meaad-logo.png" alt="Meaad">
<h1>404</h1>
<div class="columns">
  <div dir="ltr"><h2>Page not found</h2><p class="muted">The requested course resource may have moved. Return to the unified student portal to continue your learning journey.</p><a class="btn" href="./">Open course portal</a></div>
  <div dir="rtl" lang="ar"><h2>الصفحة غير موجودة</h2><p class="muted">قد يكون مورد الدورة المطلوب قد نُقل. ارجعي إلى بوابة المتدرب الموحدة لمتابعة رحلة التعلم.</p><a class="btn" href="./">فتح بوابة الدورة</a></div>
</div>
</main>
</body>
</html>
