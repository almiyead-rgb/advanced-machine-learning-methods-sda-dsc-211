name: Portal Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - design/premium-course-overview
    paths:
      - 'index.html'
      - 'ar.html'
      - 'en.html'
      - 'student-hub.css'
      - 'styles/**'
      - 'assets/**'
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'content/**'
      - 'scripts/check_portal.py'
      - 'scripts/check_release_coordination.py'
      - 'scripts/build_portal_release_manifest.py'
      - 'release/portal_release_scope.json'
      - '.github/workflows/portal_release_candidate.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'ar.html'
      - 'en.html'
      - 'student-hub.css'
      - 'styles/**'
      - 'assets/**'
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'content/**'
      - 'scripts/check_portal.py'
      - 'scripts/check_release_coordination.py'
      - 'scripts/build_portal_release_manifest.py'
      - 'release/portal_release_scope.json'
      - '.github/workflows/portal_release_candidate.yml'

permissions:
  contents: write

concurrency:
  group: $${{ github.workflow }}-$${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: ${{ github.event_name == 'push' }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Validate production portal
        run: python scripts/check_portal.py --output check-output/portal-quality.json
      - name: Validate portal and learner-template coordination
        run: python scripts/check_release_coordination.py --output check-output/release-coordination.json
      - name: Build deterministic candidate manifest
        run: |
          mkdir -p release check-output
          python scripts/build_portal_release_manifest.py --output release/portal_release_manifest.candidate.json
          cp release/portal_release_manifest.candidate.json check-output/portal_release_manifest.candidate.json
      - name: Commit candidate manifest on the controlled branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/portal_release_manifest.candidate.json
          if git diff --cached --quiet; then
            echo 'Candidate manifest is already current.'
          else
            git commit -m 'Refresh portal release candidate manifest'
            git push
          fi
      - name: Upload portal release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portal-release-candidate
          path: check-output
          retention-days: 30
