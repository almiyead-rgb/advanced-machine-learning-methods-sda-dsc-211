name: Add daily video dropdowns

on:
  push:
    branches:
      - student-flow/day-video-dropdowns
    paths:
      - scripts/add_day_video_dropdowns.py
      - index.html
      - student-hub.css
      - .github/workflows/add_day_video_dropdowns.yml

permissions:
  contents: write

concurrency:
  group: add-daily-video-dropdowns
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: student-flow/day-video-dropdowns
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Add dropdowns and verified video links
        run: python scripts/add_day_video_dropdowns.py
      - name: Verify dropdown count and links
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('class="video-dropdown"') == 5
          assert html.count('youtube.com/watch?v=') == 10
          for day in range(1, 6):
              assert f'class="day-card day-{day}"' in html
          assert 'فيديوهات اليوم | Day videos' in html
          print('Daily video dropdowns verified.')
          PY
      - name: Commit generated portal files
        run: |
          if git diff --quiet -- index.html student-hub.css; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html student-hub.css
          git commit -m 'Add video dropdowns to every course day'
          git push origin HEAD:student-flow/day-video-dropdowns
