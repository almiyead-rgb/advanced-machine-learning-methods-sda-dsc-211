name: Portal Quality Check

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'ar.html'
      - 'en.html'
      - 'bilingual-v1.1.css'
      - 'student-hub.css'
      - 'scripts/check_portal.py'
      - '.github/workflows/portal_quality.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'ar.html'
      - 'en.html'
      - 'bilingual-v1.1.css'
      - 'student-hub.css'
      - 'scripts/check_portal.py'
      - '.github/workflows/portal_quality.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate bilingual unified student portal
        run: python scripts/check_portal.py --output check-output/portal-quality.json
      - name: Upload portal quality report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portal-quality
          path: check-output
          retention-days: 14
